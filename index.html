<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project - Receipt Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <!-- Favicon Lesson: https://www.w3schools.com/html/html_favicon.asp -->
    <link rel="icon" type="image/png" href="Images/Logo Shortcut.png">
</head>
<body>

  <!-- Navbar Area -->
  <nav class="top-nav">
    <a href="index.html" class="nav-item active">receipt</a>
    <span class="nav-divider">|</span>
    <a href="sku.html" class="nav-item">sku</a>
  </nav>

  <div class="container">

    <!-- Logo Made by Me (Cited in Line 9) -->
    <div class="logo">
      <img src="Images/Logo.png" alt="">
    </div>

    <!-- Menu Container -->
    <div class="menu-box">

      <h2>menu</h2>

      <!-- Using div to Organize Menu Items  -->
      <div class="menu-list" id="menu-list">

        <label class="menu-item">
          <input type="checkbox" id="item-plain" name="item" value="120">
          plain bagel w/ cream cheese: 120 PhP
        </label>

        <label class="menu-item">
          <input type="checkbox" id="item-bacon-egg" name="item" value="180">
          bacon, egg, n' cheese bagel: 180 PhP
        </label>

        <label class="menu-item">
          <input type="checkbox" id="item-everything" name="item" value="250">
          everything bagel: 250 PhP
        </label>

        <label class="menu-item">
          <input type="checkbox" id="item-french-toast" name="item" value="160">
          french toast bagel: 160 PhP
        </label>

        <label class="menu-item">
          <input type="checkbox" id="item-cinnamon" name="item" value="140">
          cinnamon raisin bagel: 140 PhP
        </label>

        <!-- Divider to separate food items w/ drink in Menu -->
        <div class="drink-divider"></div>

        <label class="menu-item">
          <input type="checkbox" id="item-cold-brew" name="item" value="90">
          cloud cold brew: 90 PhP
        </label>

      </div>

      <!-- Logo Made by Me (Cited in Line 9) -->
      <img class="logo2" src="Images/Logo Shortcut.png" alt="">
      <button class="order-btn" id="order-btn" py-click="calculate_order">order</button>

    </div>

    <!-- Receipt Container -->
    <div class="receipt-box">

      <h2>receipt</h2>
      <div id="receipt-body">
        <!-- Placeholder before function is triggered -->
        <p class="receipt-empty">select items to see<br>your total</p> 
      </div>

    </div>
    
  </div>

  <script type="py" src="main.py"></script>

</body>
</html>
