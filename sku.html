<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Project - SKU Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="sku.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <!-- Favicon Lesson: https://www.w3schools.com/html/html_favicon.asp -->
    <link rel="icon" type="image/png" href="Images/Logo Shortcut.png">
</head>
<body>

  <!-- Navbar Area -->
  <nav class="top-nav">
    <a href="index.html" class="nav-item">receipt</a>
    <span class="nav-divider">|</span>
    <a href="sku.html" class="nav-item active">sku</a>
  </nav>

  <div class="container">

    <!-- Logo Made by Me (Cited in Line 9) -->
    <div class="logo">
      <img src="Images/Logo.png" alt="">
    </div>

    <!-- SKU Input Container -->
    <div class="generator-box">
      <h2>sku generator</h2>

      <div class="sku-form">
        
        <!-- Category Select -->
        <div class="form-group">
          <label for="category-input">category</label>
          <select id="category-input" class="sku-input">
            <!-- Values are shortened to match unique code of SKU  -->
            <option value="BGL">bagels</option>
            <option value="BVG">beverages</option>
            <option value="CNS">cream cheese n' spreads</option>
            <option value="BNS">bakery n' sweets</option>
            <option value="MER">merchandise</option>
          </select>
        </div>

        <!-- Product Name Text field  -->
        <div class="form-group">
          <label for="product-input">product name</label>
          <input type="text" id="product-input" class="sku-input" placeholder="e.g. plain bagel">
        </div>

        <!-- Stock Quantity field -->
        <div class="form-group">
          <label for="qty-input">stock quantity</label>
          <input type="number" id="qty-input" class="sku-input" placeholder="e.g. 50">
        </div>

      </div>

      <!-- Logo Made by Me (Cited in Line 9) -->
      <img class="logo2" src="Images/Logo Shortcut.png" alt="">
      <button class="order-btn" id="sku-btn" py-click="generate_sku">generate</button>
    </div>

    <!-- Output -->
    <div class="output-box">
      <h2>sku result</h2>
      <div id="sku-result">
        <!-- Placeholder before function is triggered -->
        <p class="output-empty">fill inputs to see<br>your SKU code</p>
      </div>
    </div>

  </div>

  <script type="py" src="main.py"></script>

</body>
</html>
